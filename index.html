<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#17324d">
  <title>DKW(早慶同)親睦麻雀大会</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <button class="title-button" id="homeButton" type="button">
        <span class="eyebrow">2026.10.24 SAT</span>
        <span class="site-title">DKW(早慶同)親睦麻雀大会</span>
      </button>
      <div class="sync-status" id="syncStatus">読み込み中...</div>
    </div>
  </header>

  <nav class="main-nav" aria-label="メインメニュー">
    <button class="nav-btn active" data-view="matchups">組み合わせ</button>
    <button class="nav-btn" data-view="individual">個人成績</button>
    <button class="nav-btn" data-view="universities">大学順位</button>
  </nav>

  <main class="page-shell">
    <section id="view-matchups" class="view active">
      <div class="section-head">
        <div><p class="section-kicker">MATCHUPS</p><h1>組み合わせ</h1></div>
        <button class="ghost-btn" id="refreshPublicButton" type="button">最新情報に更新</button>
      </div>
      <div class="round-tabs" id="matchupRoundTabs"></div>
      <div id="matchupsContent"></div>
    </section>

    <section id="view-individual" class="view">
      <div class="section-head"><div><p class="section-kicker">INDIVIDUAL</p><h1>個人成績</h1></div></div>
      <div class="round-tabs" id="individualRoundTabs"></div>
      <div class="notice-card compact" id="individualRoundNotice"></div>
      <div class="table-wrap"><table class="result-table" id="individualTable"></table></div>
    </section>

    <section id="view-universities" class="view">
      <div class="section-head"><div><p class="section-kicker">TEAM</p><h1>大学順位</h1></div></div>
      <div class="notice-card compact">大学順位は、各大学8名全員の得点合計で算出します。</div>
      <div id="universityCards" class="university-cards"></div>
      <div class="table-wrap"><table class="result-table" id="universityTable"></table></div>
    </section>
  </main>

  <div id="toast" class="toast hidden"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="public.js"></script>
</body>
</html>
